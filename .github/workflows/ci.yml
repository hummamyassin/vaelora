name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, typecheck, validate, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No secrets are read. AI checks use the offline replay evaluation only,
    # and the build runs without provider credentials.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate activity and weather data
        run: npm run validate

      - name: Offline AI evaluation
        run: npm run eval

      - name: Production build
        run: npm run build
